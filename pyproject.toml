[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adscout"
version = "0.1.0"
description = "Investigador de mercado para productos digitales en la Biblioteca de anuncios de Meta"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38.0",
    "SQLAlchemy>=2.0.30",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.1",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[tool.setuptools.packages.find]
include = ["adscout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
